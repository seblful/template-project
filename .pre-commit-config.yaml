# Local hooks run via `uv run`, so uv.lock pins their versions, as in the template.
# Snapshots are rendered projects, checked by their own hooks in the slow tests. Their
# CI files are checked here too, by check-yaml and zizmor, which cannot read the Jinja
# sources they come from.
exclude: ^tests/snapshots/(?!.*(/\.github/workflows/|/\.gitlab-ci\.yml$))
repos:
  - repo: local
    hooks:
      # tests/ only: template/ is linted by the generated project's own config, once
      # rendered, and its few plain .py files follow those rules, not these.
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
        files: ^tests/
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        files: ^tests/
      - id: mdformat
        name: mdformat
        entry: uv run mdformat
        language: system
        types: [markdown]
      - id: actionlint
        name: actionlint
        entry: uv run actionlint
        language: system
        # Not the snapshots': actionlint resolves a local reusable workflow from this
        # repo's root. tests/test_rendering.py runs it inside each rendered project.
        files: ^\.github/workflows/.*\.ya?ml$
      # These formats have no inline comments: `uv.lock  # note` silently stops
      # matching uv.lock, because the `# note` becomes part of the pattern.
      - id: no-inline-ignore-comments
        name: no inline comments in ignore files
        entry: '^[^#\s].*\s#'
        language: pygrep
        files: (^|/)(\.gitignore|\.ignore|\.gitattributes|\.prekignore)(\.jinja)?$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  # Sees the template's workflows as rendered, in tests/snapshots.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor
