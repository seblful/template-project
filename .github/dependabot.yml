# Covers this repo's own pins. Pins inside template/ (action hashes in ci.yml.jinja,
# hook revs, tool floors) are not .yml files, so Dependabot cannot see them: bump those
# by hand when a hook run or CI shows a newer release. The cooldown lets a compromised
# release be yanked before it reaches you.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      uv:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns: ["*"]
