# Covers this repo's own pins. The pins inside template/ (action hashes, hook revs, the
# Bun version, the web app's npm ranges) are .jinja files, which Dependabot cannot read:
# renovate.json covers those. The cooldown lets a compromised release be yanked before
# it reaches you.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      uv:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns: ["*"]
