name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # git init warns without an identity even though the commit task sets its own.
  GIT_AUTHOR_NAME: template-ci
  GIT_AUTHOR_EMAIL: ci@example.com
  GIT_COMMITTER_NAME: template-ci
  GIT_COMMITTER_EMAIL: ci@example.com

jobs:
  hooks:
    name: repo hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: ""

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run hooks
        run: uvx pre-commit run --all-files --show-diff-on-failure

  generate:
    name: ${{ matrix.os }} / py${{ matrix.python_version }} / ${{ matrix.license }} / ${{ matrix.project_type }} / config=${{ matrix.config_file }} / ci=${{ matrix.ci }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The 3.11 row is a cli with a config file on purpose: the oldest Python meets
        # the stdlib tomllib there.
        include:
          - {os: ubuntu-latest, python_version: "3.14", license: None, project_type: cli, config_file: "true", ci: github, claude_settings: "true"}
          - {os: ubuntu-latest, python_version: "3.14", license: MIT, project_type: library, config_file: "false", ci: gitlab, claude_settings: "false"}
          - {os: ubuntu-latest, python_version: "3.11", license: Apache, project_type: cli, config_file: "true", ci: none, claude_settings: "false"}
          - {os: ubuntu-latest, python_version: "3.12", license: MIT, project_type: library, config_file: "false", ci: github, claude_settings: "true"}
          - {os: windows-latest, python_version: "3.14", license: Apache, project_type: cli, config_file: "false", ci: gitlab, claude_settings: "true"}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Full version pin, not `@v10`: astral-sh/setup-uv dropped moving major tags.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: ""  # no lockfile here to key the cache on

      - name: Generate a project
        shell: bash
        run: |
          uvx copier copy --trust --defaults --vcs-ref=HEAD \
            -d project_slug=demo-proj \
            -d package_name=demo_proj \
            -d project_description="A generated demo project." \
            -d author_name="Demo Author" \
            -d author_email=demo@example.com \
            -d python_version='${{ matrix.python_version }}' \
            -d license='${{ matrix.license }}' \
            -d project_type='${{ matrix.project_type }}' \
            -d config_file='${{ matrix.config_file }}' \
            -d ci='${{ matrix.ci }}' \
            -d claude_settings='${{ matrix.claude_settings }}' \
            "$GITHUB_WORKSPACE" ../demo-proj

      # ruff format --check is load-bearing: no generation task formats anything, so
      # this sees exactly what the template sources render to.
      - name: Lint, format, types
        shell: bash
        working-directory: ../demo-proj
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run ty check

      - name: Tests
        shell: bash
        working-directory: ../demo-proj
        run: uv run pytest --cov

      # Packaging only; settings behavior is the generated test suite's job. Run from
      # an empty directory, so the import cannot fall back to the source tree.
      - name: Installed wheel works
        shell: bash
        working-directory: ../demo-proj
        run: |
          uv build --wheel
          mkdir ../wheel-smoke
          cd ../wheel-smoke
          run() {
            uv run --no-project --isolated --python '${{ matrix.python_version }}' \
              --with "$(ls ../demo-proj/dist/*.whl)" "$@"
          }
          run python -c "import demo_proj; assert demo_proj.__version__ == '0.1.0'"
          if [ '${{ matrix.project_type }}' = cli ]; then
            run demo-proj --version | grep -q 'demo-proj 0.1.0'
            run demo-proj info
          fi
          [ -z "$(ls -A)" ] || { echo "::error::the wheel wrote into the cwd"; exit 1; }

      - name: Docs
        shell: bash
        working-directory: ../demo-proj
        run: |
          uv sync --group docs
          uv run mkdocs build --strict

      - name: Pre-commit hooks
        shell: bash
        working-directory: ../demo-proj
        run: |
          test -f .git/hooks/pre-commit
          test -f .git/hooks/pre-push
          uv run pre-commit run --all-files --show-diff-on-failure
          uv run pre-commit run --all-files --hook-stage pre-push

      # `[^$]` before `{{` excludes GitHub Actions' own `${{ ... }}` expressions.
      - name: Assert no unrendered Jinja survived
        shell: bash
        working-directory: ../demo-proj
        run: |
          if git grep -nE '(^|[^$])\{\{|\{%' -- . ':!uv.lock'; then
            echo "::error::unrendered Jinja found in the generated project"
            exit 1
          fi

      # A conditional filename that renders empty is silently skipped by copier, so a
      # typo here would otherwise produce a missing file with no error.
      - name: Assert the answers produced the right files
        shell: bash
        working-directory: ../demo-proj
        run: |
          fail() { echo "::error::$1"; exit 1; }
          cli_files="src/demo_proj/cli.py src/demo_proj/__main__.py
            src/demo_proj/settings.py src/demo_proj/logging.py .env.example
            tests/conftest.py tests/test_cli.py tests/test_settings.py
            tests/test_logging.py tests/test_config_roundtrip.py"
          [ -f tests/test_package.py ] || fail "tests/test_package.py is missing"

          case '${{ matrix.ci }}' in
            github)
              [ -f .github/workflows/ci.yml ] || fail "ci=github produced no workflow"
              [ -f .github/dependabot.yml ] || fail "ci=github produced no dependabot.yml"
              [ ! -e .gitlab-ci.yml ] || fail "ci=github also produced .gitlab-ci.yml"
              uvx --from actionlint-py actionlint .github/workflows/ci.yml
              ;;
            gitlab)
              [ -f .gitlab-ci.yml ] || fail "ci=gitlab produced no pipeline"
              [ ! -e .github ] || fail "ci=gitlab also produced .github"
              # Parse only: real validation needs a GitLab token, which this repo lacks
              uvx --with pyyaml python -c \
                "import pathlib, yaml; yaml.safe_load(pathlib.Path('.gitlab-ci.yml').read_text())"
              ;;
            none)
              [ ! -e .github ] || fail "ci=none still produced .github"
              [ ! -e .gitlab-ci.yml ] || fail "ci=none still produced .gitlab-ci.yml"
              ;;
          esac

          if [ '${{ matrix.project_type }}' = cli ]; then
            for f in $cli_files; do
              [ -f "$f" ] || fail "project_type=cli is missing $f"
            done
            grep -q '^\[project.scripts\]' pyproject.toml \
              || fail "project_type=cli declares no console script"
          else
            for f in $cli_files; do
              [ ! -e "$f" ] || fail "project_type=library still produced $f"
            done
            grep -qx 'dependencies = \[\]' pyproject.toml \
              || fail "project_type=library still has runtime dependencies"
          fi

          if [ '${{ matrix.project_type }}' = cli ] && [ '${{ matrix.config_file }}' = true ]; then
            [ -f config.example.toml ] || fail "config_file=true produced no config.example.toml"
            grep -q -- '"--config"' src/demo_proj/cli.py || fail "config_file=true has no --config"
          else
            [ ! -e config.example.toml ] || fail "config_file=false still produced config.example.toml"
            if grep -q 'TomlConfigSettingsSource' src/demo_proj/*.py; then
              fail "config_file=false still wires up config files"
            fi
          fi

          if [ '${{ matrix.claude_settings }}' = true ]; then
            [ -f .claude/settings.json ] || fail "claude_settings=true produced no .claude"
          else
            [ ! -e .claude ] || fail "claude_settings=false still produced .claude"
          fi

  update:
    name: copier update from latest tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags are the released versions copier resolves

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: ""  # no lockfile here to key the cache on

      - name: Resolve the previous release
        id: prev
        run: echo "tag=$(git tag --sort=-v:refname | head -n1)" >> "$GITHUB_OUTPUT"

      # --with jinja2-time: the previous release's LICENSE template still needs it,
      # unlike HEAD, which is why the update step below omits it.
      - name: Generate at the previous release
        if: steps.prev.outputs.tag != ''
        run: |
          uvx --with jinja2-time copier copy --trust --defaults \
            --vcs-ref='${{ steps.prev.outputs.tag }}' \
            -d project_slug=demo-proj -d package_name=demo_proj -d license=MIT \
            -d author_name="Demo Author" -d author_email=demo@example.com \
            "$GITHUB_WORKSPACE" ../demo-proj

      - name: Update to HEAD
        if: steps.prev.outputs.tag != ''
        working-directory: ../demo-proj
        run: uvx copier update --trust --defaults --vcs-ref=HEAD --conflict=rej

      # A clean update should produce no .rej files. The one exempt shape is a pure
      # creation hunk that already matches the file on disk — copier's old-state
      # render can go missing a file the project already has when an `_exclude`
      # entry it depended on is gone, and then tries to recreate it for nothing.
      - name: Assert the update applied cleanly
        if: steps.prev.outputs.tag != ''
        working-directory: ../demo-proj
        run: |
          status=0
          while IFS= read -r rej; do
            target="${rej%.rej}"
            header=$(sed -n '2p' "$rej")
            body=$(sed -n '3,$p' "$rej" | sed 's/^+//')
            if [[ "$header" =~ ^@@\ -0,0 ]] && [ -f "$target" ] \
               && [ "$body" = "$(cat "$target")" ]; then
              echo "::notice::benign reject, file already identical: $rej"
              rm -f "$rej"
            else
              echo "::error::copier update produced a real conflict: $rej"
              status=1
            fi
          done < <(find . -name '*.rej' -not -path './.git/*')
          exit $status

      - name: Gates still pass after update
        if: steps.prev.outputs.tag != ''
        working-directory: ../demo-proj
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run ty check
          uv run pytest --cov
