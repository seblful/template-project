name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # git init warns without an identity even though the commit task sets its own.
  GIT_AUTHOR_NAME: template-ci
  GIT_AUTHOR_EMAIL: ci@example.com
  GIT_COMMITTER_NAME: template-ci
  GIT_COMMITTER_EMAIL: ci@example.com

jobs:
  hooks:
    name: repo hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run hooks
        run: uvx pre-commit run --all-files --show-diff-on-failure

  generate:
    name: ${{ matrix.os }} / ${{ matrix.answers }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Answer sets live in tests/test_template.py; each job generates one of them.
        include:
          - {os: ubuntu-latest, answers: cli-config-github}
          - {os: ubuntu-latest, answers: library-gitlab}
          - {os: ubuntu-latest, answers: cli-config-py311}
          - {os: ubuntu-latest, answers: library-py312-github}
          - {os: windows-latest, answers: cli-gitlab}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Full version pin, not `@v10`: astral-sh/setup-uv dropped moving major tags.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('template/.pre-commit-config.yaml') }}

      - name: Generate and check a project
        run: |
          uv sync --locked
          uv run pytest -k '${{ matrix.answers }}'

  update:
    name: copier update from latest tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags are the released versions copier resolves

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('template/.pre-commit-config.yaml') }}

      - name: Update a project from the latest tag
        run: |
          uv sync --locked
          uv run pytest -k update
