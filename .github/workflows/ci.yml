name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly canary: resolves the newest dependency releases

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # git init warns without an identity even though the commit task sets its own.
  GIT_AUTHOR_NAME: template-ci
  GIT_AUTHOR_EMAIL: ci@example.com
  GIT_COMMITTER_NAME: template-ci
  GIT_COMMITTER_EMAIL: ci@example.com
  # The only place this repo names a Bun version; the template's packageManager must
  # match it, which tests/test_rendering.py checks.
  BUN_VERSION: "1.4.2"
  # Generated projects resolve dependencies as of the commit that last changed the
  # template's floors (see tests/conftest.py), so an upstream release cannot fail an
  # unrelated change. The schedule resolves the newest releases instead, and so finds
  # that breakage on its own.
  TEMPLATE_UNPINNED: ${{ github.event_name == 'schedule' && '1' || '' }}

jobs:
  hooks:
    name: repo hooks
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        # Hash pins throughout, as zizmor requires: a tag can be moved to other code.
        # Dependabot bumps the hash and the version comment together.
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true

      - name: Cache prek environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run hooks
        run: |
          uv sync --locked
          uv run prek run --all-files --show-diff-on-failure

  render:
    name: render and compare snapshots
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true

      # The default run: renders every answer set without tasks and compares the files.
      - name: Render
        run: |
          uv sync --locked
          uv run pytest

  generate:
    name: ${{ matrix.os }} / ${{ matrix.answers }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Answer sets live in tests/support.py; each job generates one of them and
        # runs every check the project defines.
        include:
          - {os: ubuntu-latest, answers: cli-github}
          - {os: ubuntu-latest, answers: library-github-py312}
          - {os: ubuntu-latest, answers: api-web-github}
          - {os: windows-latest, answers: cli-none-py311}
          - {os: windows-latest, answers: library-gitlab}
          - {os: windows-latest, answers: api-gitlab-py313}
          - {os: windows-latest, answers: api-web-gitlab-py312}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the dependency cutoff is a commit date, so it needs history

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true

      # Web answer sets run `bun install` while generating.
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache prek environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          # prek keeps its environments in ~/.cache on Linux, %LOCALAPPDATA% on Windows.
          path: |
            ~/.cache/prek
            ~/AppData/Local/prek
          key: prek-${{ runner.os }}-${{ hashFiles('template/.pre-commit-config.yaml.jinja') }}

      - name: Generate and check a project
        run: |
          uv sync --locked
          uv run pytest -m slow -k '${{ matrix.answers }}'

  update:
    name: copier update (${{ matrix.tests }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # From the latest tag, and from an api to an api with a web app.
        tests: [latest_release, web_app]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # tags are the released versions copier resolves

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache prek environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('template/.pre-commit-config.yaml.jinja') }}

      - name: Update a project
        run: |
          uv sync --locked
          uv run pytest -m slow -k '${{ matrix.tests }}'
