name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # git init warns without an identity even though the commit task sets its own.
  GIT_AUTHOR_NAME: template-ci
  GIT_AUTHOR_EMAIL: ci@example.com
  GIT_COMMITTER_NAME: template-ci
  GIT_COMMITTER_EMAIL: ci@example.com

jobs:
  hooks:
    name: repo hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true

      - name: Cache prek environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run hooks
        run: |
          uv sync --locked
          uv run prek run --all-files --show-diff-on-failure

  generate:
    name: ${{ matrix.os }} / ${{ matrix.answers }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Answer sets live in tests/test_template.py; each job generates one of them.
        include:
          - {os: ubuntu-latest, answers: cli-config-github}
          - {os: ubuntu-latest, answers: library-gitlab}
          - {os: ubuntu-latest, answers: cli-config-py311}
          - {os: ubuntu-latest, answers: library-py312-github}
          - {os: windows-latest, answers: cli-gitlab}
          - {os: ubuntu-latest, answers: api-github}
          - {os: windows-latest, answers: api-gitlab-py311}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        # Hash pins throughout, as zizmor requires: a tag can be moved to other code.
        # Dependabot bumps the hash and the version comment together.
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true

      - name: Cache prek environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          # prek keeps its environments in ~/.cache on Linux, %LOCALAPPDATA% on Windows.
          path: |
            ~/.cache/prek
            ~/AppData/Local/prek
          key: prek-${{ runner.os }}-${{ hashFiles('template/.pre-commit-config.yaml.jinja') }}

      - name: Generate and check a project
        run: |
          uv sync --locked
          uv run pytest -k '${{ matrix.answers }}'

  update:
    name: copier update from latest tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # tags are the released versions copier resolves

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true

      - name: Cache prek environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          # prek keeps its environments in ~/.cache on Linux, %LOCALAPPDATA% on Windows.
          path: |
            ~/.cache/prek
            ~/AppData/Local/prek
          key: prek-${{ runner.os }}-${{ hashFiles('template/.pre-commit-config.yaml.jinja') }}

      - name: Update a project from the latest tag
        run: |
          uv sync --locked
          uv run pytest -k update
