name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Copier's _tasks run `git commit`, which needs an identity. The commit task
  # supplies its own via `git -c`, but `git init` still warns without these.
  GIT_AUTHOR_NAME: template-ci
  GIT_AUTHOR_EMAIL: ci@example.com
  GIT_COMMITTER_NAME: template-ci
  GIT_COMMITTER_EMAIL: ci@example.com

jobs:
  hooks:
    name: repo hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: ""

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run hooks
        run: uvx pre-commit run --all-files --show-diff-on-failure

  # The template itself cannot be linted: `from {{ package_name }} import ...` is not
  # valid Python, so ruff and ty cannot parse the .jinja sources. The only meaningful
  # check is to generate a project and run the gates the template claims to ship.
  generate:
    name: ${{ matrix.os }} / py${{ matrix.python_version }} / ${{ matrix.license }} / ${{ matrix.project_type }} / ci=${{ matrix.ci }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Five combinations chosen to cover every license branch, both project types,
        # every CI answer, both claude_settings values, both ends of the supported
        # Python range and both OSes — rather than a 72-cell product that tests the
        # same code paths over and over.
        include:
          - {os: ubuntu-latest, python_version: "3.13", license: None, project_type: cli, ci: github, claude_settings: "true"}
          - {os: ubuntu-latest, python_version: "3.13", license: MIT, project_type: library, ci: gitlab, claude_settings: "false"}
          - {os: ubuntu-latest, python_version: "3.12", license: Apache, project_type: cli, ci: none, claude_settings: "false"}
          - {os: ubuntu-latest, python_version: "3.10", license: MIT, project_type: library, ci: github, claude_settings: "true"}
          - {os: windows-latest, python_version: "3.13", license: Apache, project_type: cli, ci: gitlab, claude_settings: "true"}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # A full version, not `@v10`: astral-sh/setup-uv stopped publishing moving
        # major tags after v7, so a bare major does not resolve.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          # This repo has no pyproject.toml or uv.lock of its own — it is a Copier
          # template, not a Python project — so there is no dependency file to key the
          # cache on. Empty means "never invalidate", which is right here: the cache
          # only holds wheels downloaded while generating throwaway projects.
          cache-dependency-glob: ""

      # An absolute source path, because copier records it as `_src_path` in
      # .copier-answers.yml and later resolves it from the *project* directory.
      - name: Generate a project
        shell: bash
        run: |
          uvx copier copy --trust --defaults --vcs-ref=HEAD \
            -d project_slug=demo-proj \
            -d package_name=demo_proj \
            -d project_description="A generated demo project." \
            -d author_name="Demo Author" \
            -d author_email=demo@example.com \
            -d python_version='${{ matrix.python_version }}' \
            -d license='${{ matrix.license }}' \
            -d project_type='${{ matrix.project_type }}' \
            -d ci='${{ matrix.ci }}' \
            -d claude_settings='${{ matrix.claude_settings }}' \
            "$GITHUB_WORKSPACE" ../demo-proj

      # `ruff format --check` is the load-bearing assertion here. Generation runs
      # `ruff format` as a task, so a badly formatted template would still produce a
      # clean tree — but only for people who pass --trust. This step fails instead if
      # the .jinja sources drift from the style the template itself enforces.
      - name: Lint, format, types
        shell: bash
        working-directory: ../demo-proj
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run ty check

      - name: Tests
        shell: bash
        working-directory: ../demo-proj
        run: uv run pytest --cov

      - name: Docs
        shell: bash
        working-directory: ../demo-proj
        run: |
          uv sync --group docs
          uv run mkdocs build --strict

      # The hook suite is what generated projects gate commits and pushes on, so it
      # has to pass on a freshly generated tree. `git init` and `pre-commit install`
      # already ran as copier tasks.
      - name: Pre-commit hooks
        shell: bash
        working-directory: ../demo-proj
        run: |
          test -f .git/hooks/pre-commit
          test -f .git/hooks/pre-push
          uv run pre-commit run --all-files --show-diff-on-failure
          uv run pre-commit run --all-files --hook-stage pre-push

      # `[^$]` before `{{` so GitHub Actions' own `${{ ... }}` expressions in the
      # generated workflow are not mistaken for template leftovers.
      - name: Assert no unrendered Jinja survived
        shell: bash
        working-directory: ../demo-proj
        run: |
          if git grep -nE '(^|[^$])\{\{|\{%' -- . ':!uv.lock'; then
            echo "::error::unrendered Jinja found in the generated project"
            exit 1
          fi

      # Every conditional path in the template is asserted here. A conditional filename
      # that renders to the empty string is silently skipped by copier, so a typo in
      # one produces a project that is merely missing a file — no error anywhere.
      - name: Assert the answers produced the right files
        shell: bash
        working-directory: ../demo-proj
        run: |
          fail() { echo "::error::$1"; exit 1; }
          cli_files="src/demo_proj/cli.py src/demo_proj/__main__.py tests/test_cli.py"

          # Exactly one pipeline definition, no orphan of the other kind, and whatever
          # it produced has to parse.
          case '${{ matrix.ci }}' in
            github)
              [ -f .github/workflows/ci.yml ] || fail "ci=github produced no workflow"
              [ ! -e .gitlab-ci.yml ] || fail "ci=github also produced .gitlab-ci.yml"
              uvx --from actionlint-py actionlint .github/workflows/ci.yml
              ;;
            gitlab)
              [ -f .gitlab-ci.yml ] || fail "ci=gitlab produced no pipeline"
              [ ! -e .github ] || fail "ci=gitlab also produced .github"
              # A parse only. Validating GitLab semantics needs the CI Lint API, which
              # needs a GitLab token this repository has no business holding.
              uvx --with pyyaml python -c \
                "import pathlib, yaml; yaml.safe_load(pathlib.Path('.gitlab-ci.yml').read_text())"
              ;;
            none)
              [ ! -e .github ] || fail "ci=none still produced .github"
              [ ! -e .gitlab-ci.yml ] || fail "ci=none still produced .gitlab-ci.yml"
              ;;
          esac

          if [ '${{ matrix.project_type }}' = cli ]; then
            for f in $cli_files; do
              [ -f "$f" ] || fail "project_type=cli is missing $f"
            done
            grep -q '^\[project.scripts\]' pyproject.toml \
              || fail "project_type=cli declares no console script"
          else
            for f in $cli_files; do
              [ ! -e "$f" ] || fail "project_type=library still produced $f"
            done
            if grep -q '"typer' pyproject.toml; then
              fail "project_type=library still depends on typer"
            fi
          fi

          if [ '${{ matrix.claude_settings }}' = true ]; then
            [ -f .claude/settings.json ] || fail "claude_settings=true produced no .claude"
          else
            [ ! -e .claude ] || fail "claude_settings=false still produced .claude"
          fi

  # `copier update` is the path most likely to break silently: it is exercised by
  # every existing project and by nobody during development.
  update:
    name: copier update from latest tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags are the released versions copier resolves

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          # This repo has no pyproject.toml or uv.lock of its own — it is a Copier
          # template, not a Python project — so there is no dependency file to key the
          # cache on. Empty means "never invalidate", which is right here: the cache
          # only holds wheels downloaded while generating throwaway projects.
          cache-dependency-glob: ""

      - name: Resolve the previous release
        id: prev
        run: echo "tag=$(git tag --sort=-v:refname | head -n1)" >> "$GITHUB_OUTPUT"

      # Still --with jinja2-time: the released tag being generated from predates the
      # removal of that extension, so its LICENSE template still needs it. HEAD does
      # not, which is why the update step below runs a plain copier.
      - name: Generate at the previous release
        if: steps.prev.outputs.tag != ''
        run: |
          uvx --with jinja2-time copier copy --trust --defaults \
            --vcs-ref='${{ steps.prev.outputs.tag }}' \
            -d project_slug=demo-proj -d package_name=demo_proj -d license=MIT \
            -d author_name="Demo Author" -d author_email=demo@example.com \
            "$GITHUB_WORKSPACE" ../demo-proj

      - name: Update to HEAD
        if: steps.prev.outputs.tag != ''
        working-directory: ../demo-proj
        run: uvx copier update --trust --defaults --vcs-ref=HEAD --conflict=rej

      # A clean template-to-template update over an unmodified project should produce
      # no conflicts at all. Any .rej means the update would land badly on real users.
      #
      # One shape is exempt: a pure creation hunk (`@@ -0,0 ...`) whose content already
      # matches the file on disk. Copier renders the *old* state using the old
      # template's `_exclude` against the *current* answers, so removing an answer that
      # an older `_exclude` referenced makes the old state come out missing a file the
      # project already has — and the patch then tries to create it. Nothing is lost
      # and nothing needs merging, so this is reported and skipped rather than failed.
      - name: Assert the update applied cleanly
        if: steps.prev.outputs.tag != ''
        working-directory: ../demo-proj
        run: |
          status=0
          while IFS= read -r rej; do
            target="${rej%.rej}"
            header=$(sed -n '2p' "$rej")
            body=$(sed -n '3,$p' "$rej" | sed 's/^+//')
            if [[ "$header" =~ ^@@\ -0,0 ]] && [ -f "$target" ] \
               && [ "$body" = "$(cat "$target")" ]; then
              echo "::notice::benign reject, file already identical: $rej"
              rm -f "$rej"
            else
              echo "::error::copier update produced a real conflict: $rej"
              status=1
            fi
          done < <(find . -name '*.rej' -not -path './.git/*')
          exit $status

      - name: Gates still pass after update
        if: steps.prev.outputs.tag != ''
        working-directory: ../demo-proj
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run ty check
          uv run pytest --cov
