name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly canary: resolves the newest dependency releases

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # git init warns without an identity even though the commit task sets its own.
  GIT_AUTHOR_NAME: template-ci
  GIT_AUTHOR_EMAIL: ci@example.com
  GIT_COMMITTER_NAME: template-ci
  GIT_COMMITTER_EMAIL: ci@example.com
  # Generated projects resolve dependencies as of the commit that last changed the
  # template's floors (see tests/conftest.py), so an upstream release cannot fail an
  # unrelated change. The schedule resolves the newest releases instead, and so finds
  # that breakage on its own.
  TEMPLATE_UNPINNED: ${{ github.event_name == 'schedule' && '1' || '' }}

jobs:
  fast:
    name: repo hooks and snapshots
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        # Hash pins throughout, as zizmor requires: a tag can be moved to other code.
        # Dependabot bumps the hash and the version comment together.
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true

      - name: Cache prek environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # The default pytest run renders every answer set without tasks and compares
      # the files with tests/snapshots.
      - name: Run hooks and render
        run: |
          uv sync --locked
          uv run prek run --all-files --show-diff-on-failure
          uv run pytest

  slow:
    name: ${{ matrix.os }} / ${{ matrix.select }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Answer sets live in tests/support.py; each generates one and runs every
        # check the project defines. The last two run `copier update`: from the
        # latest tag, and from an api to an api with a web app.
        include:
          - {os: ubuntu-latest, select: cli-github}
          - {os: ubuntu-latest, select: library-github-py312}
          - {os: ubuntu-latest, select: api-web-github}
          - {os: windows-latest, select: cli-none-py311}
          - {os: windows-latest, select: library-gitlab}
          - {os: windows-latest, select: api-gitlab-py313}
          - {os: windows-latest, select: api-web-gitlab-py312}
          - {os: ubuntu-latest, select: latest_release}
          - {os: ubuntu-latest, select: web_app}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # The dependency cutoff is a commit date, and tags are the released
          # versions copier updates from: both need the full history.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true

      # Web answer sets run `bun install` while generating. The version is the one the
      # template pins, read from a rendered package.json the snapshot test keeps current.
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version-file: tests/snapshots/api-web-github/web/package.json

      - name: Cache prek environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          # prek keeps its environments in ~/.cache on Linux, %LOCALAPPDATA% on Windows.
          path: |
            ~/.cache/prek
            ~/AppData/Local/prek
          key: prek-${{ runner.os }}-${{ hashFiles('template/.pre-commit-config.yaml.jinja') }}

      - name: Generate and check
        run: |
          uv sync --locked
          uv run pytest -m slow -k '${{ matrix.select }}'
