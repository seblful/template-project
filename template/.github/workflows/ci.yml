name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly dependency audit

# Least privilege: nothing in this workflow writes to the repo.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Full version pin, not `@v10`: astral-sh/setup-uv dropped moving major tags.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked  # fails on a stale lockfile instead of masking it

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # Every check lives in .pre-commit-config.yaml; the manual stage runs all of
      # them. gitleaks scans staged changes, so this is not a full-history secret scan.
      - name: Checks
        run: uv run pre-commit run --all-files --hook-stage manual --show-diff-on-failure

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Audit locked dependencies
        run: |
          uv export --format requirements-txt --no-emit-project --all-groups \
            > requirements-audit.txt
          uvx pip-audit --disable-pip --requirement requirements-audit.txt
