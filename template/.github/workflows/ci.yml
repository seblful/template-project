name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      # --locked fails when uv.lock is stale instead of quietly regenerating it, so a
      # forgotten `uv lock` is caught here rather than drifting per machine.
      - name: Install dependencies
        run: uv sync --locked

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # The hook suite is the single source of truth for lint, format and type-check,
      # so CI cannot drift from what runs locally. Note: the gitleaks hook scans
      # *staged* changes, so it is a no-op here — it guards commits, not CI. Add
      # a full-history scan as a separate job if you need one.
      - name: Lint, format, types
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Tests
        run: uv run pytest --cov
