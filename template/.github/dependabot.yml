# Nothing else bumps the pinned action versions in workflows/ci.yml or the hook revs in
# .pre-commit-config.yaml. The uv ecosystem is left out on purpose: a ruff or ty bump
# can change lint results, so `uv lock --upgrade` stays a deliberate step.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    groups:
      pre-commit:
        patterns: ["*"]
