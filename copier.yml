_subdirectory: template

project_name:
  type: str
  help: What is your project name?

package_name:
  type: str
  help: What is your Python package name? (snake_case)

project_description:
  type: str
  help: What is the project description?
  default: A Python project.

author_name:
  type: str
  help: What is the author name?
  default: Aliaksei Chymba

author_email:
  type: str
  help: What is the author email?
  choices:
    - alesha.chimba@gmail.com
    - achimba@twelvedevs.com
  default: alesha.chimba@gmail.com

license:
  type: str
  help: What license should the project use?
  choices:
    - None
    - Apache
    - MIT
    - EULA
  default: None

current_year:
  type: str
  help: What year should be in the copyright notice?
  default: "2026"

python_version:
  type: str
  help: What Python version should the project target?
  default: "3.13"

code_assistant:
  type: str
  help: Which code assistant will you use?
  choices:
    - claude
    - opencode
    - cursor
  default: claude

environments:
  help: Which environment-specific .env files should be created?
  multiselect: true
  choices:
    - development
    - staging
    - production
  default: []

include_claude_settings:
  type: bool
  help: Include Claude Code settings files (.claude/settings.json, .claude/settings.local.json)?
  default: false

_exclude:
  - notebooks/.gitkeep
  - scripts/.gitkeep
  - docs/.gitkeep
  - "{% if code_assistant != 'claude' %}.claude/**{% endif %}"
  - "{% if not include_claude_settings %}.claude/settings.json{% endif %}"
  - "{% if 'development' not in environments %}.env.development{% endif %}"
  - "{% if 'staging' not in environments %}.env.staging{% endif %}"
  - "{% if 'production' not in environments %}.env.production{% endif %}"

_tasks:
  - ["git", "init"]
  - ["uv", "sync"]
  - ["uv", "run", "ruff", "format", "."]
  - ["uv", "run", "ruff", "check", "--fix", "."]
  - ["uv", "run", "mdformat", "."]
  - ["uv", "run", "pre-commit", "install"]
