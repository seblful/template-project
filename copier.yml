_subdirectory: template

_jinja_extensions:
  - jinja2_time.TimeExtension

project_slug:
  type: str
  help: What is your project name? (kebab-case)
  default: "{{ _copier_conf.dst_path.name | lower | replace('_', '-') | replace(' ', '-') }}"
  validator: >-
    {% if not (project_slug | regex_search('^[a-z0-9]+(-[a-z0-9]+)*$')) %}
    project_slug must be kebab-case: lowercase letters and digits separated by single hyphens (e.g. my-cool-project)
    {% endif %}

package_name:
  type: str
  help: What is your Python package name? (snake_case)
  default: "{{ project_slug | replace('-', '_') }}"
  validator: >-
    {% if not (package_name | regex_search('^[a-z][a-z0-9_]*$')) %}
    package_name must be a valid Python identifier: lowercase letter first, then lowercase letters, digits or underscores (e.g. my_cool_project)
    {% endif %}

project_description:
  type: str
  help: What is the project description?
  default: A Python project.

author_name:
  type: str
  help: What is the author name?
  default: Aliaksei Chymba

author_email:
  type: str
  help: What is the author email?
  choices:
    - alesha.chimba@gmail.com
    - achimba@twelvedevs.com
  default: alesha.chimba@gmail.com

license:
  type: str
  help: What license should the project use?
  choices:
    - None
    - Apache
    - MIT
    - EULA
  default: None

python_version:
  type: str
  help: What Python version should the project target?
  default: "3.13"

code_assistant:
  type: str
  help: Which code assistant will you use?
  choices:
    - claude
    - opencode
    - cursor
  default: claude

environments:
  help: Which environment-specific .env files should be created?
  multiselect: true
  choices:
    - development
    - staging
    - production
  default: []

_exclude:
  - notebooks/.gitkeep
  - scripts/.gitkeep
  - docs/.gitkeep
  - "{% if code_assistant != 'claude' %}.claude/**{% endif %}"
  - "{% if 'development' not in environments %}.env.development{% endif %}"
  - "{% if 'staging' not in environments %}.env.staging{% endif %}"
  - "{% if 'production' not in environments %}.env.production{% endif %}"

_tasks:
  - ["git", "init"]
  - ["uv", "sync"]
  - ["uv", "run", "ruff", "format", "."]
  - ["uv", "run", "ruff", "check", "--fix", "."]
  - ["uv", "run", "mdformat", "."]
  - ["uv", "run", "pre-commit", "install"]
  - command: ["git", "add", "-A"]
    when: "{{ _copier_operation == 'copy' }}"
  - command: ["git", "commit", "-m", "chore: initial commit from template", "--no-verify"]
    when: "{{ _copier_operation == 'copy' }}"
