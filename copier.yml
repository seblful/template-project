_subdirectory: template

_min_copier_version: "9.2.0"  # _tasks below need _copier_operation, added in 9.2

project_slug:
  type: str
  help: What is your project name? (kebab-case)
  default: "{{ _copier_conf.dst_path.name | lower | replace('_', '-') | replace(' ', '-') }}"
  validator: >-
    {% if not (project_slug | regex_search('^[a-z0-9]+(-[a-z0-9]+)*$')) %}
    project_slug must be kebab-case: lowercase letters and digits separated by single hyphens (e.g. my-cool-project)
    {% endif %}

package_name:
  type: str
  help: What is your Python package name? (snake_case)
  default: "{{ project_slug | replace('-', '_') }}"
  validator: >-
    {% if not (package_name | regex_search('^[a-z][a-z0-9_]*$')) %}
    package_name must be a valid Python identifier: lowercase letter first, then lowercase letters, digits or underscores (e.g. my_cool_project)
    {% endif %}

project_description:
  type: str
  help: What is the project description?
  default: A Python project.

project_type:
  type: str
  help: What kind of project is this?
  choices:
    - cli
    - library
  default: cli

author_name:
  type: str
  help: What is the author name?
  # No default: an empty answer must fail, not silently attribute the project to us.
  validator: "{% if not author_name.strip() %}author_name must not be empty{% endif %}"

author_email:
  type: str
  help: What is the author email?
  validator: >-
    {% if not (author_email | regex_search('^[^@\s]+@[^@\s]+\.[^@\s]+$')) %}
    author_email must be a valid email address
    {% endif %}

license:
  type: str
  help: What license should the project use?
  choices:
    - None
    - MIT
    - Apache
  default: None

python_version:
  type: str
  help: What Python version should the project target? (major.minor)
  default: "3.13"
  # Floor is 3.10: generated sources use PEP 604 unions in runtime type annotations.
  validator: >-
    {% if not (python_version | regex_search('^3\.1[0-9]$')) %}
    python_version must be 3.10 or newer, major.minor only, e.g. 3.13 (a patch version
    produces an invalid "Programming Language :: Python :: X" classifier)
    {% endif %}

ci:
  type: str
  help: Which CI should run the project's checks?
  choices:
    - github
    - gitlab
    - none
  default: github

claude_settings:
  type: bool
  help: Ship .claude/settings.json with project-scoped Claude Code permissions?
  default: true

# Setting _exclude replaces copier's own defaults, so they are repeated here.
_exclude:
  - "copier.yml"
  - "copier.yaml"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".git"
  - ".DS_Store"
  - ".svn"
  - "{% if not claude_settings %}.claude{% endif %}"
  - "{% if ci != 'github' %}.github{% endif %}"

_tasks:
  - ["git", "init"]
  - ["uv", "sync"]
  - ["uv", "run", "ruff", "check", "--fix", "."]  # --fix before format, not after
  - ["uv", "run", "ruff", "format", "."]
  - ["uv", "run", "mdformat", "."]
  - ["uv", "run", "pre-commit", "install"]
  - command: ["git", "add", "-A"]
    when: "{{ _copier_operation == 'copy' }}"
  # -c avoids needing a global git identity (e.g. a fresh CI runner).
  - command:
      - "git"
      - "-c"
      - "user.name={{ author_name }}"
      - "-c"
      - "user.email={{ author_email }}"
      - "commit"
      - "-m"
      - "chore: initial commit from template"
      - "--no-verify"
    when: "{{ _copier_operation == 'copy' }}"

_message_after_copy: |
  {{ project_slug }} is ready.

      cd {{ _copier_conf.dst_path.name }}
      cp .env.example .env
  {%- if project_type == 'cli' %}
      uv run {{ project_slug }} info
  {%- endif %}

  .env.example is the committed contract listing every supported key; your own .env is
  gitignored and yours to edit. Docs tooling installs separately with
  `uv sync --group docs`.

  Git hooks are installed: lint, formatting and types run on commit, the test suite
  runs on push.

_message_after_update: |
  Template updated. Re-run the gates before committing. `pre-commit install` is in
  the list because a new hook type (this template installs pre-push hooks as well as
  pre-commit ones) reaches an existing checkout only when install runs again:

      uv run pre-commit install
      uv run pre-commit run --all-files
      uv run pytest --cov

  Updating across v0.9 may leave a `.claude/settings.json.rej` whose contents already
  match the file beside it. Copier renders the previous state without that file once
  the answer its old `_exclude` referenced is gone; nothing is lost, so delete the
  .rej.

  The template no longer generates a .env — .env.example is the single contract, and
  your own .env is now yours alone. If yours disappeared in this update, restore it
  with `git checkout` or recreate it from .env.example; nothing reads it at build time.
