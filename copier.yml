_subdirectory: template

_min_copier_version: "9.2.0"  # _tasks below need _copier_operation, added in 9.2

project_slug:
  type: str
  help: What is your project name? (kebab-case)
  default: "{{ _copier_conf.dst_path.name | lower | replace('_', '-') | replace(' ', '-') }}"
  validator: >-
    {% if not (project_slug | regex_search('^[a-z0-9]+(-[a-z0-9]+)*$')) %}
    project_slug must be kebab-case: lowercase letters and digits separated by single hyphens (e.g. my-cool-project)
    {% endif %}

# Asked before the names below, since it decides whether there is a Python package.
project_type:
  type: str
  help: What kind of project is this?
  choices:
    - cli
    - library
    - api
    - frontend
  default: cli

# Derived, never asked. `when: false` also keeps them out of the answers file, so an
# update recomputes them from project_type instead of replaying a stale value.
monorepo:
  type: bool
  # cli and library stay a single package at the root, where `uv tool install` and
  # PyPI expect it. api and frontend live in apps/, so the other can join later.
  default: "{{ project_type in ['api', 'frontend'] }}"
  when: false

has_python:
  type: bool
  # A frontend still uses uv, for the hooks and the docs, but ships no Python code.
  default: "{{ project_type != 'frontend' }}"
  when: false

has_backend:
  type: bool
  default: "{{ project_type == 'api' }}"
  when: false

has_frontend:
  type: bool
  default: "{{ project_type == 'frontend' }}"
  when: false

application:
  type: bool
  # Applications load settings and configure logging; a library leaves both to its host.
  default: "{{ project_type in ['cli', 'api'] }}"
  when: false

python_prefix:
  type: str
  # Where the Python package sits relative to the root, for paths in shared config.
  default: "{{ 'apps/api/' if has_backend else '' }}"
  when: false

package_name:
  type: str
  help: What is your Python package name? (snake_case)
  default: "{{ project_slug | replace('-', '_') }}"
  when: "{{ has_python }}"
  validator: >-
    {% if not (package_name | regex_search('^[a-z][a-z0-9_]*$')) %}
    package_name must be a valid Python identifier: lowercase letter first, then lowercase letters, digits or underscores (e.g. my_cool_project)
    {% endif %}

project_description:
  type: str
  help: What is the project description?
  default: "{{ 'A web frontend.' if project_type == 'frontend' else 'A Python project.' }}"
  # Rendered inside quoted TOML and YAML strings, where these characters break parsing.
  validator: >-
    {% if not project_description.strip() %}
    project_description must not be empty
    {% elif project_description | regex_search('["\\\x00-\x1f]') %}
    project_description must not contain double quotes, backslashes or control
    characters such as line breaks
    {% endif %}

config_file:
  type: bool
  help: Support an explicitly selected TOML config file (--config config.toml)?
  default: false
  # Only applications load settings; a library leaves configuration to its host.
  when: "{{ project_type == 'cli' }}"

author_name:
  type: str
  help: What is the author name?
  # No default: an empty answer must fail, not silently attribute the project to us.
  # The character check matches project_description's: this lands in quoted strings
  # too, in pyproject.toml, zensical.toml and __init__.py.
  validator: >-
    {% if not author_name.strip() %}
    author_name must not be empty
    {% elif author_name | regex_search('["\\\\\x00-\x1f]') %}
    author_name must not contain double quotes, backslashes or control characters
    {% endif %}

author_email:
  type: str
  help: What is the author email?
  validator: >-
    {% if not (author_email | regex_search('^[^@\s"\\\\]+@[^@\s"\\\\]+\.[^@\s"\\\\]+$')) %}
    author_email must be a valid email address
    {% endif %}

license:
  type: str
  help: What license should the project use?
  choices:
    - None
    - MIT
    - Apache
  default: None

python_version:
  type: str
  help: What Python version should the project target? (major.minor)
  # Not 3.15 yet: PyYAML, which Zensical needs, has no 3.15 wheels, so installing the
  # docs group on Windows would need a C compiler. Flip this once PyYAML ships them.
  default: "3.14"
  # Floor is 3.11: 3.10 is end-of-life, and generated sources use the stdlib tomllib
  # and logging.getLevelNamesMapping, both new in 3.11.
  validator: >-
    {% if not (python_version | regex_search('^3\.(1[1-9]|[2-9][0-9])$')) %}
    python_version must be 3.11 or newer, major.minor only, e.g. 3.14 (a patch version
    produces an invalid "Programming Language :: Python :: X" classifier)
    {% endif %}

ci:
  type: str
  help: Which CI should run the project's checks?
  choices:
    - github
    - gitlab
    - none
  default: github

claude_settings:
  type: bool
  help: Ship .claude/settings.json with project-scoped Claude Code permissions?
  default: true

# Setting _exclude replaces copier's own defaults, so they are repeated here.
_exclude:
  - "copier.yml"
  - "copier.yaml"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".git"
  - ".DS_Store"
  - ".svn"
  - "{% if not claude_settings %}.claude{% endif %}"
  - "{% if ci != 'github' %}.github{% endif %}"

# No formatter runs here. Template sources ship already formatted, so a formatter
# could only hide a template bug from CI's --check, and on `copier update` it would
# rewrite the user's own code inside the update diff.
_tasks:
  # Not gated on copy: `copier update` renders the new version into a scratch dir and
  # runs these tasks there as well, and prek install fails outside a repo.
  - ["git", "init"]
  - ["uv", "sync"]
  # No bun.lock ships with the template: the first install resolves current versions.
  - command: ["bun", "install"]
    when: "{{ has_frontend }}"
  # Also on update: a hook type the template adds reaches a checkout only via install.
  # --force because a shim left by pre-commit would otherwise survive as a legacy hook
  # that prek still runs, and it fails now that pre-commit is no longer installed.
  - ["uv", "run", "prek", "install", "--force"]
  - command: ["git", "add", "-A"]
    when: "{{ _copier_operation == 'copy' }}"
  # -c avoids needing a global git identity (e.g. a fresh CI runner).
  - command:
      - "git"
      - "-c"
      - "user.name={{ author_name }}"
      - "-c"
      - "user.email={{ author_email }}"
      - "commit"
      - "-m"
      - "chore: initial commit from template"
      - "--no-verify"
    when: "{{ _copier_operation == 'copy' }}"

# A note that only matters when an update crosses one release lives in
# migrations/<version>.txt, gated on that version, not in _message_after_update,
# which every later update would print. Printed with uv's Python because there is no
# `cat` on Windows, and inlining the text would echo it twice in copier's task line.
_migrations:
  - version: v0.9.0
    when: "{{ _stage == 'after' }}"
    command:
      - uv
      - run
      - --no-project
      - python
      - -c
      - "import pathlib, sys; print(pathlib.Path(sys.argv[1]).read_text('utf-8'))"
      - "{{ _copier_conf.src_path }}/migrations/v0.9.0.txt"
  - version: v0.9.3
    when: "{{ _stage == 'after' }}"
    command:
      - uv
      - run
      - --no-project
      - python
      - -c
      - "import pathlib, sys; print(pathlib.Path(sys.argv[1]).read_text('utf-8'))"
      - "{{ _copier_conf.src_path }}/migrations/v0.9.3.txt"
  - version: v1.0.0
    when: "{{ _stage == 'after' }}"
    command:
      - uv
      - run
      - --no-project
      - python
      - -c
      - "import pathlib, sys; print(pathlib.Path(sys.argv[1]).read_text('utf-8'))"
      - "{{ _copier_conf.src_path }}/migrations/v1.0.0.txt"
  - version: v1.0.1
    when: "{{ _stage == 'after' }}"
    command:
      - uv
      - run
      - --no-project
      - python
      - -c
      - "import pathlib, sys; print(pathlib.Path(sys.argv[1]).read_text('utf-8'))"
      - "{{ _copier_conf.src_path }}/migrations/v1.0.1.txt"

_message_after_copy: |
  {{ project_slug }} is ready.

      cd {{ _copier_conf.dst_path.name }}
  {%- if project_type == 'cli' %}
      cp .env.example .env
      uv run {{ project_slug }} --env-file .env info

  .env.example is the committed contract listing every supported key; your own .env is
  gitignored and yours to edit. Select it explicitly with --env-file or
  load_settings(env_file=Path(".env")); files are never discovered automatically.
  {%- elif project_type == 'api' %}
      cp apps/api/.env.example apps/api/.env
      uv run {{ project_slug }} serve --env-file apps/api/.env

  The interactive API docs are then at http://127.0.0.1:8000/api/docs.
  apps/api/.env.example is the committed contract listing every supported key; your
  own .env is gitignored and yours to edit. Files are never discovered automatically.
  {%- elif project_type == 'frontend' %}
      bun run --cwd apps/web dev

  The app is then at http://localhost:5173 and reloads as you edit apps/web/src.
  {%- endif %}

  Docs tooling installs separately with `uv sync --group docs`.

  Git hooks are installed: lint, formatting, types and the commit message format are
  checked on commit, the tests and the docs build on push. Every check at once:

      uv run prek run --all-files --hook-stage manual

_message_after_update: |
  Template updated. Re-run every check before committing:

      uv run prek run --all-files --hook-stage manual
