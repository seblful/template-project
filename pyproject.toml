# Not the template: nothing here is rendered, built or installed. This only pins the
# tools that tests/ uses to generate projects from template/ and check them.
[project]
name = "template-project-tests"
version = "0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "copier>=9.2.0,<10",  # the floor copier.yml's _min_copier_version sets
    "pytest>=9.0.0,<10",
    "pyyaml>=6.0,<7",
    "actionlint-py>=1.7.0,<2",
    "ruff>=0.17.0,<0.18",
    "mdformat>=1.0.0,<2",
    "prek>=0.5.5,<0.6",  # pre-1.0: breaking changes land between patch releases
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Slow tests generate a project with its tasks and run its checks, which needs uv, Bun
# and network access; run them with `-m slow`. The default run renders only.
addopts = "-ra --strict-markers --strict-config -m 'not slow' --ignore=tests/snapshots"
markers = ["slow: generate a project, install its dependencies and run its checks"]
xfail_strict = true

[tool.ruff]
line-length = 88
extend-exclude = ["template", "tests/snapshots"]  # linted once rendered, by their own config

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "PT", "PTH", "RUF", "SIM", "UP", "W"]

[tool.ruff.lint.pydocstyle]
convention = "google"
